        - "Galeria de Óculos · de 16k → 63k em outubro"
        - "Prycia · 15k só no dia da inauguração"

    countdown:
      ativo: true
      deadline: "2026-05-08T17:00:00-03:00"
      formato: "DD : HH : MM : SS"
      posicao: "seção pricing + compacto no topbar"

    barra_progresso:
      ativo: true
      animacao: "IntersectionObserver — preenche da esquerda pra direita ao entrar na viewport"
      cor: "gradient gold → vermelho conforme % sobe"
      percent_inicial: 67

  referencia_visual:
