        - "Estratégia → oferta certa, no momento certo, pro cliente certo"
        - "Execução → ação dentro da ótica + digital, sem achismo"

    - id: erros_fatais
      headline: "Você vai continuar no mesmo lugar se:"
      cards:
        - "⊗ Ficar esperando o mês melhorar sozinho"
        - "⊗ Montar promoção sem estratégia de posicionamento"
        - "⊗ Depender de agência pra fazer o básico"
        - "⊗ Focar em campanha sem organizar a venda dentro da ótica"

    - id: prova_social
      headline: "Nossos resultados"
      depoimentos:
        - nome: "Michaella"
          resultado: "Aumentamos mais de 30 mil no nosso faturamento só com os conteúdos do desafio"
          tipo: "print whatsapp"
        - nome: "Galeria de Óculos"
          resultado: "Entrou faturando 16k no mês. Fechou outubro com 63 mil."
          tipo: "screenshot reels"
        - nome: "Prycia"
          resultado: "Somente no dia da inauguração: 15 mil. Trabalhamos muito bem o digital."
          tipo: "print whatsapp"
      estilo: "cards flutuando com animação fadeInUp + float loop suave"

    - id: conteudo_programatico
      headline: "O que você vai aprender"
      fundo: "dark (#0A0A0F)"
      numeros_grandes: true
      itens:
        - num: "01"
          titulo: "Posicionamento"
          desc: "Como se apresentar pra atrair quem compra, não quem pede desconto"
        - num: "02"
          titulo: "Estratégia de venda"
          desc: "Como montar suas campanhas e o que ofertar pra gerar venda de verdade"
        - num: "03"
          titulo: "Ações no dia a dia"
          desc: "O que fazer dentro da ótica e no digital pra gerar movimento"
        - num: "04"
          titulo: "Execução guiada"
          desc: "Ao vivo com a Cindy e equipe, ajustando junto em tempo real"
        - num: "05"
          titulo: "Plano de Maio"
          desc: "Sair do desafio com tudo montado e pronto pra executar"

    - id: o_que_inclui
      itens:
        - label: "3 dias de imersão ao vivo"
          preco_riscado: "R$297"
        - label: "Materiais estratégicos de apoio"
          preco_riscado: "R$197"
        - label: "Grupo VIP Oficial"
          preco_riscado: "R$197"
      total_riscado: "R$691"
      preco_final: "R$67"

    - id: cronograma
      headline: "O desafio mais prático que uma ótica já teve."
      datas: "11, 12 e 13 de Maio · 19h · Online · Ao Vivo"
      aviso: "Não recomendado pra quem quer só teoria. Aqui a gente executa."

    - id: preco_escassez
      headline: "Quanto custa?"
      countdown_deadline: "2026-05-08T17:00:00-03:00"
      barra_progresso: true
      barra_percent: 67
      barra_texto: "vagas restantes neste lote"
      ancora_valor: "R$691"
      preco: "R$67"
      pagamento: "Pix ou cartão"
      cta: "Quero meu acesso agora"
      checkout_url: "https://pay.kiwify.com.br/nHOyQ2K"

  interatividade:
    provas_flutuantes:
      ativo: true
      animacao: "fadeInUp + float suave (translateY -8px loop)"
      posicoes: "hero (direita), meio da página, pricing"
      conteudo:
