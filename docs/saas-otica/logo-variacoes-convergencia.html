<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VIZIOM — Logo Convergência</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #F5F5F7; font-family: 'Inter', 'Arial Black', system-ui, sans-serif; }

.header {
  background: #09090B;
  padding: 64px 80px;
}
.h-label { display: block; font-size: 10px; letter-spacing: 5px; color: #555; text-transform: uppercase; margin-bottom: 12px; }
.h-name  { display: block; font-size: 56px; font-weight: 900; letter-spacing: 16px; color: #fff; }
.h-sub   { display: block; font-size: 12px; color: #444; letter-spacing: 2px; margin-top: 10px; }

.section { padding: 80px; background: white; border-bottom: 1px solid #EBEBEB; }
.section:nth-child(even) { background: #FAFAFA; }

.sec-header {
  display: flex; align-items: baseline; gap: 20px; margin-bottom: 48px;
}
.sec-num   { font-size: 10px; letter-spacing: 3px; color: #C8C8D8; text-transform: uppercase; }
.sec-title { font-size: 22px; font-weight: 900; }
.sec-desc  { font-size: 12px; color: #AAAABB; margin-left: auto; }

.lockups {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 16px; margin-bottom: 20px;
}

.lk {
  padding: 48px 56px; border-radius: 12px;
  display: flex; align-items: center; gap: 24px; position: relative;
}
.lk-light { background: white; border: 1px solid #EBEBEB; }
.lk-dark  { background: #09090B; }

.lk-lbl {
  position: absolute; top: 12px; left: 14px;
  font-size: 8px; letter-spacing: 2.5px; text-transform: uppercase;
}
.lk-light .lk-lbl { color: #D8D8E0; }
.lk-dark  .lk-lbl { color: #333; }

.wm { font-size: 36px; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; line-height: 1; }
.lk-light .wm { color: #09090B; }
.lk-dark  .wm { color: white; }

.scales {
  display: flex; align-items: flex-end; gap: 36px;
  padding: 40px 48px; background: #F2F2F7; border-radius: 12px;
}
.sc     { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.sc-lbl { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: #BBBBC8; }

.app-wrap {
  width: 56px; height: 56px;
  background: #4F46E5; border-radius: 22%;
  display: flex; align-items: center; justify-content: center;
}

footer {
  background: #09090B; padding: 28px 80px;
  display: flex; justify-content: space-between; align-items: center;
}
</style>
</head>
<body>

<div class="header">
  <span class="h-label">Identidade Visual — Logo System</span>
  <span class="h-name">VIZIOM</span>
  <span class="h-sub">Conceito Convergência · 5 Variações</span>
</div>

<div id="root"></div>

<footer>
  <span style="font-size:9px;letter-spacing:3px;color:#333;text-transform:uppercase;">VIZIOM Brand System</span>
  <span style="font-size:9px;letter-spacing:3px;color:#333;text-transform:uppercase;">Identidade Visual</span>
  <span style="font-size:9px;letter-spacing:3px;color:#4F46E5;text-transform:uppercase;">Conceito Convergência</span>
</footer>

<script>
const I = '#4F46E5';
const A = '#F59E0B';
const W = '#ffffff';
const M = '#1A1A1A';

const VARS = [
  {
    title: 'Simétrico',
    desc: '6 raios · 60° · stroke 9 · base do conceito (igual à imagem)',
    sym: (s, a) => `
      <line x1="50" y1="50" x2="50"   y2="20" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="76"   y2="35" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="76"   y2="65" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="50"   y2="80" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="24"   y2="65" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="24"   y2="35" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <circle cx="50" cy="50" r="10" fill="${a}"/>
    `
  },
  {
    title: 'Rotacionado',
    desc: '6 raios · 30° offset · sem eixo vertical puro · mais dinâmico',
    sym: (s, a) => `
      <line x1="50" y1="50" x2="65"   y2="24" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="80"   y2="50" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="65"   y2="76" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="35"   y2="76" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="20"   y2="50" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50" y1="50" x2="35"   y2="24" stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <circle cx="50" cy="50" r="10" fill="${a}"/>
    `
  },
  {
    title: '8 Raios',
    desc: '8 raios · 45° · stroke 6 · mais denso e premium',
    sym: (s, a) => `
      <line x1="50"   y1="50" x2="50"   y2="18"   stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="72.6" y2="27.4" stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="82"   y2="50"   stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="72.6" y2="72.6" stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="50"   y2="82"   stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="27.4" y2="72.6" stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="18"   y2="50"   stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <line x1="50"   y1="50" x2="27.4" y2="27.4" stroke="${s}" stroke-width="6" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="9" fill="${a}"/>
    `
  },
  {
    title: 'Focal',
    desc: '6 raios · gap do centro · âmbar maior · efeito roda de luz',
    sym: (s, a) => `
      <line x1="50"    y1="37"   x2="50"   y2="20"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="61.3"  y1="43.5" x2="76"   y2="35"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="61.3"  y1="56.5" x2="76"   y2="65"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="50"    y1="63"   x2="50"   y2="80"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="38.7"  y1="56.5" x2="24"   y2="65"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <line x1="38.7"  y1="43.5" x2="24"   y2="35"  stroke="${s}" stroke-width="9"  stroke-linecap="round"/>
      <circle cx="50" cy="50" r="14" fill="${a}"/>
    `
  },
  {
    title: 'Cruz Bold',
    desc: '4 raios · 90° · stroke 13 · máxima força · menos floco de neve',
    sym: (s, a) => `
      <line x1="50" y1="50" x2="50"   y2="14"  stroke="${s}" stroke-width="13" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="86"   y2="50"  stroke="${s}" stroke-width="13" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="50"   y2="86"  stroke="${s}" stroke-width="13" stroke-linecap="round"/>
      <line x1="50" y1="50" x2="14"   y2="50"  stroke="${s}" stroke-width="13" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="12" fill="${a}"/>
    `
  }
];

function mksvg(paths, w, h) {
  return `<svg width="${w}" height="${h}" viewBox="0 0 100 100">${paths}</svg>`;
}

document.getElementById('root').innerHTML = VARS.map((v, i) => {
  const n  = String(i + 1).padStart(2, '0');
  const pl = v.sym(I, A);
  const pd = v.sym(W, A);
  const pm = v.sym(M, M);

  return `
  <section class="section">
    <div class="sec-header">
      <span class="sec-num">Variação ${n}</span>
      <span class="sec-title">${v.title}</span>
      <span class="sec-desc">${v.desc}</span>
    </div>

    <div class="lockups">
      <div class="lk lk-light">
        <span class="lk-lbl">Fundo Claro</span>
        ${mksvg(pl, 72, 72)}
        <span class="wm">VIZIOM</span>
      </div>
      <div class="lk lk-dark">
        <span class="lk-lbl">Fundo Escuro</span>
        ${mksvg(pd, 72, 72)}
        <span class="wm">VIZIOM</span>
      </div>
    </div>

    <div class="scales">
      <div class="sc">${mksvg(pl, 80, 80)}<span class="sc-lbl">80px</span></div>
      <div class="sc">${mksvg(pl, 48, 48)}<span class="sc-lbl">48px</span></div>
      <div class="sc">${mksvg(pl, 32, 32)}<span class="sc-lbl">32px</span></div>
      <div class="sc">${mksvg(pl, 20, 20)}<span class="sc-lbl">Favicon</span></div>
      <div class="sc">${mksvg(pm, 44, 44)}<span class="sc-lbl">Mono</span></div>
      <div class="sc">
        <div class="app-wrap">${mksvg(pd, 38, 38)}</div>
        <span class="sc-lbl">App Icon</span>
      </div>
    </div>
  </section>
  `;
}).join('');
</script>
</body>
</html>
