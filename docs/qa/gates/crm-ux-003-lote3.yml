focos_auditados:
  - id: FOCO-1
    titulo: "Loop de navegação (hash x realtime x applyRole)"
    resultado: PASS
    evidencia: "1 navegação por mudança de URL; 0 re-disparos por clique. A flag _navegando corta o ciclo goTo -> hash -> hashchange -> goTo."
  - id: FOCO-2
    titulo: "Chip para status que NÃO abre modal (ex.: qualificado)"
    resultado: PASS
    evidencia: >
      Move direto, sem modal-transition; o detalhe é reaberto e o chip reflete o novo status.
      Primeira medição deu falso negativo (esperei 500ms; o await loadHistory() real levou mais).
      Log instrumentado confirmou a ordem correta: openDetail é chamado com o cache já atualizado.
  - id: FOCO-3
    titulo: "Deep-link para view proibida ao role"
    resultado: PASS
    evidencia: "Como CS, '#pipeline' cai em view-cs (viewPermitida=false, viewPadrao=cs). Não vaza navegação."
  - id: FOCO-4
    titulo: "Regressão dos Lotes 1 e 2"
    resultado: PASS
    evidencia: "MOTIVOS_PERDA(6), undo, 'if (!ok) return', contarMovimento, filterLeadsSemPeriodo, currentFinanceiro, EXPERTS sem Dr. Alex no cadastro."
  - id: FOCO-5
    titulo: "Mobile / chips"
    resultado: PASS
    evidencia: "8 chips no detalhe, atual .sel e disabled; 0 emojis renderizados (innerText limpo)."

issues:
  - id: DEBT-1
    severity: low
    category: performance
    description: >
      aplicarStatus() faz 'await loadHistory()' (chamada de rede) ANTES de reabrir o modal de
      detalhe. Pelo chip, o usuário espera ~300ms para o chip refletir o novo status.
    recommendation: "Reabrir o modal de detalhe antes do loadHistory(), ou recarregar o histórico em background. Não bloqueia."

