issues:
  - id: ISSUE-1
    status: RESOLVIDO (re-verificado no browser)
    fix: >
      updateLeadField() passou a retornar boolean; aplicarStatus() aborta antes do toast
      de sucesso e de onLeadFechado() quando ok === false. Re-teste: com erro simulado
      aparece SÓ o toast vermelho e o modal de venda não abre; no caminho feliz o toast
      "Lead movido para Follow Up" segue normal.
    severity: high
    category: correctness
    description: >
      aplicarStatus() exibe "Lead movido para X" mesmo quando updateLeadField() falhou.
      updateLeadField() trata o erro internamente e não retorna status, então o sucesso é
      assumido. Evidência (browser, update simulado com erro): dois toasts simultâneos —
      "Erro ao atualizar: permission denied" seguido de "Lead movido para Fechado".
      Agrava: no status 'fechado', onLeadFechado() abre o modal de negociação para uma
      venda que não existe no banco. Um SDR barrado por RLS acredita ter salvo.
    recommendation: >
      updateLeadField() deve retornar boolean (ok). aplicarStatus() só toasta sucesso,
      renderiza e chama onLeadFechado() se ok === true; se falhou, recarrega e mostra só o erro.
    files: ["docs/crm/index.html: updateLeadField (l.1430), aplicarStatus (l.2233)"]

  - id: ISSUE-2
    severity: low
    category: dead-code
    description: "moveTo(id, status) (l.2203) não é chamado por ninguém — resquício do fluxo antigo."
    recommendation: "Remover no Lote 3 (limpeza), não bloqueia."

  - id: ISSUE-3
    severity: low
    category: tech-debt
    description: "updateCSField() tem o mesmo padrão (mostra erro e segue como se tivesse salvo). Pré-existente, fora do escopo do Lote 1."
    recommendation: "Backlog: aplicar o mesmo contrato de retorno no Lote 2."

