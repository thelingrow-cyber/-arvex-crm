nota_do_qa: >
  O valor entregue por este lote NÃO é a redução de bytes (-1,1%) — é o índice de domínios no
  cabeçalho do script. Ele permite que um agente greppe "===== DOMINIO: CS" e leia só aquele
  trecho, em vez de reler 235KB. As convenções que já causaram bugs reais nesta série (TDZ do
  Lote 2; "sucesso só após o banco confirmar", do Lote 1) agora estão escritas onde quem edita
  o arquivo vai ler ANTES de repetir o erro. Isso é prevenção, não cosmética.

