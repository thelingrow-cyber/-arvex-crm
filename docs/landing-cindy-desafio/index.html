<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Desafio Ótica 10X — Cindy Batista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #FFFFFF;
      --cream-2:  #FAFAFA;
      --gold:     #B8860B;
      --gold-lt:  #DDB870;
      --gold-dk:  #7A5A14;
      --dark:     #14172E;
      --navy:     #1F2D52;
      --green:    #25D366;
      --green-dk: #1DA851;
      --muted:    #5C5C68;
      --red:      #D63333;
    }

    html, body {
      background: #F8F5FB;
      color: var(--dark);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        radial-gradient(ellipse 60% 40% at 15% 20%, rgba(180,160,220,0.22) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 85% 30%, rgba(150,180,220,0.20) 0%, transparent 60%),
        radial-gradient(ellipse 80% 50% at 50% 70%, rgba(200,210,235,0.18) 0%, transparent 70%),
        linear-gradient(180deg, #FDFCFE 0%, #FAF8FC 30%, #F4F2FA 65%, #EFEEF8 100%);
    }

    /* manchas de blur azul que continuam abaixo da foto */
    body::before {
      content: '';
      position: fixed;
      bottom: -10%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(170,150,210,0.18) 0%, transparent 60%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(140,170,210,0.20) 0%, transparent 60%);
      filter: blur(40px);
      z-index: 0;
      pointer-events: none;
    }

    /* ── TOPBAR ── */
    .topbar {
      flex-shrink: 0;
      padding: 12px 20px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold-dk);
      position: relative;
      z-index: 5;
    }
    .topbar__live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--red);
    }
    .topbar__live::before {
      content: '';
      width: 6px; height: 6px;
      background: var(--red);
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .topbar__sep { color: var(--gold); opacity: 0.5; letter-spacing: 0; }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.3; transform: scale(0.6); }
    }
    .topbar::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: 0.5;
    }

    /* ── HERO ── */
    .hero {
      flex: 0 0 auto;
      height: 50svh;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* camada de blend extra entre foto e bottom */
    .hero::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: -10%;
      right: -10%;
      height: 120px;
      background: linear-gradient(180deg,
        rgba(253,252,254,0) 0%,
        rgba(253,252,254,0.5) 50%,
        rgba(250,248,252,1) 100%);
      filter: blur(20px);
      z-index: 6;
      pointer-events: none;
    }

    /* halo radial dourado */
    .hero__halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      width: min(86vw, 380px);
      height: min(86vw, 380px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(221,184,112,0.0) 0%, transparent 75%);
      z-index: 0;
      pointer-events: none;
      display: none;
    }

    /* anel duplo dourado — desabilitado pra foto wide */
    .hero__ring { display: none; }

    /* dots dourados discretos — desabilitados */
    .dot { display: none; }

    /* foto da Cindy */
    .hero__photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      transform: scale(1.85) translateY(8%);
      transform-origin: center top;
      z-index: 4;
      -webkit-mask-image: linear-gradient(180deg,
        #000 0%,
        #000 35%,
        rgba(0,0,0,0.92) 50%,
        rgba(0,0,0,0.78) 62%,
        rgba(0,0,0,0.55) 74%,
        rgba(0,0,0,0.32) 84%,
        rgba(0,0,0,0.12) 92%,
        transparent 100%);
      mask-image: linear-gradient(180deg,
        #000 0%,
        #000 35%,
        rgba(0,0,0,0.92) 50%,
        rgba(0,0,0,0.78) 62%,
        rgba(0,0,0,0.55) 74%,
        rgba(0,0,0,0.32) 84%,
        rgba(0,0,0,0.12) 92%,
        transparent 100%);
    }

    /* ── BADGE LOGO 10X (premium navy/gold) ── */
    .hero__badge {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      background: linear-gradient(135deg, #14172E 0%, #1F2D52 100%);
      border: 2px solid var(--gold);
      padding: 12px 26px 13px;
      border-radius: 50px;
      box-shadow:
        0 14px 32px rgba(20,23,46,0.45),
        0 0 0 5px rgba(184,134,11,0.10),
        inset 0 1px 0 rgba(255,255,255,0.10);
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }
    .hero__badge__star {
      color: var(--gold-lt);
      font-size: 13px;
    }
    .hero__badge__text {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.10em;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .hero__badge__num {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--gold-lt) 0%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.02em;
    }

    /* ── BOTTOM CONTENT ── */
    .bottom {
      flex: 1 1 auto;
      padding: 14px 22px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      position: relative;
      z-index: 7;
      background: transparent;
      margin-top: 0;
    }

    .headline {
      font-family: 'Inter', sans-serif;
      font-size: clamp(26px, 7.4vw, 34px);
      font-weight: 800;
      line-height: 1.18;
      color: var(--navy);
      text-align: center;
      letter-spacing: -0.015em;
      max-width: 520px;
    }
    .headline em {
      font-style: normal;
      font-weight: 800;
      color: var(--gold);
    }

    .sub {
      font-size: clamp(13px, 3.5vw, 14px);
      line-height: 1.5;
      color: var(--muted);
      text-align: center;
      max-width: 380px;
    }
    .sub strong { color: var(--dark); font-weight: 700; }

    /* CTA premium */
    .cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      max-width: 420px;
      padding: 17px 22px;
      background: linear-gradient(135deg, var(--green-dk) 0%, var(--green) 50%, var(--green-dk) 100%);
      border-radius: 50px;
      text-decoration: none;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      color: #ffffff;
      text-transform: uppercase;
      box-shadow:
        0 14px 36px rgba(37,211,102,0.45),
        0 4px 12px rgba(0,0,0,0.15),
        inset 0 1px 0 rgba(255,255,255,0.30);
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: hidden;
      margin-top: 2px;
    }
    .cta::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.30) 50%, transparent 70%);
      transform: translateX(-100%);
      animation: shine 3.5s ease-in-out infinite;
    }
    @keyframes shine {
      0%, 100% { transform: translateX(-100%); }
      50%      { transform: translateX(100%); }
    }
    .cta svg { width: 20px; height: 20px; flex-shrink: 0; }

    .cta-note {
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-align: center;
      opacity: 0.8;
    }

    /* viewports pequenos */
    @media (max-height: 720px) {
      .topbar { padding: 9px 20px 7px; font-size: 10px; }
      .headline { font-size: 23px; line-height: 1.18; }
      .sub { font-size: 12.5px; line-height: 1.4; }
      .cta { padding: 14px 22px; font-size: 14px; }
      .hero { height: 46svh; }
      .bottom { padding: 12px 22px 70px; gap: 7px; margin-top: 0; }
      .hero__badge { bottom: 12px; }
      .hero__badge { padding: 10px 22px 11px; bottom: 30%; }
      .hero__badge__text { font-size: 12px; }
      .hero__badge__num { font-size: 15px; }
    }
  </style>
</head>
<body>

  <!-- TOPBAR -->
  <header class="topbar">
    <span class="topbar__live">Ao Vivo</span>
    <span class="topbar__sep">◆</span>
    <span>11, 12 e 13 de Maio</span>
  </header>

  <!-- HERO -->
  <section class="hero">

    <!-- halo radial -->
    <div class="hero__halo"></div>

    <!-- anel duplo dourado -->
    <svg class="hero__ring" viewBox="0 0 340 340" fill="none">
      <circle cx="170" cy="170" r="160" stroke="url(#ringGrad)" stroke-width="1" opacity="0.45"/>
      <circle cx="170" cy="170" r="148" stroke="url(#ringGrad)" stroke-width="0.8" stroke-dasharray="1 5" opacity="0.5"/>
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#DDB870"/>
          <stop offset="100%" stop-color="#B8860B"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- dots dourados pulsantes -->
    <div class="dot dot--1"></div>
    <div class="dot dot--2"></div>
    <div class="dot dot--3"></div>
    <div class="dot dot--4"></div>
    <div class="dot dot--5"></div>
    <div class="dot dot--6"></div>

    <!-- foto da Cindy -->
    <img class="hero__photo" src="https://cindyb.com.br/wp-content/uploads/2025/12/bs-pdf.jpg" alt="Cindy Batista" />

    <!-- BADGE LOGO sobreposto -->
    <div class="hero__badge">
      <span class="hero__badge__star">✦</span>
      <span class="hero__badge__text">Desafio Ótica</span>
      <span class="hero__badge__num">10X</span>
    </div>

  </section>

  <!-- BOTTOM -->
  <section class="bottom">

    <h1 class="headline">
      3 dias criando a <em>campanha de Maio</em> mais lucrativa da sua ótica
    </h1>

    <p class="sub">
      Entre no <strong>Grupo VIP</strong> e tenha acesso à oferta especial do desafio.
    </p>

    <a class="cta" href="https://chat.whatsapp.com/FRRgWAFkUjtJQz0uXdOdVu" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor">

      </svg>
      Entrar no Grupo VIP
    </a>

    <span class="cta-note">Vagas limitadas · Acesso pelo WhatsApp</span>

  </section>

</body>
</html>
