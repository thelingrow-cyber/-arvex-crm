<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" style="font-family:Inter,Arial,Helvetica,sans-serif">
    <defs>
    <filter id="documentaryMono" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.12" intercept="-.035"/><feFuncG type="linear" slope="1.12" intercept="-.035"/><feFuncB type="linear" slope="1.12" intercept="-.035"/></feComponentTransfer>
    </filter>
    <filter id="warm" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values=".30 .59 .11 0 0  .279 .549 .102 0 0  .234 .460 .086 0 0  0 0 0 1 0"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.12" intercept="-.035"/><feFuncG type="linear" slope="1.12" intercept="-.035"/><feFuncB type="linear" slope="1.12" intercept="-.035"/></feComponentTransfer>
    </filter>
    <filter id="warmSoft" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values=".38"/>
      <feComponentTransfer><feFuncR type="linear" slope="1.05"/><feFuncG type="linear" slope="1.01"/><feFuncB type="linear" slope=".88"/></feComponentTransfer>
    </filter>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="23"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 .052"/></feComponentTransfer>
    </filter>
    <radialGradient id="mineralWash" cx="82%" cy="8%" r="92%"><stop offset="0" stop-color="#24404A" stop-opacity=".34"/><stop offset=".44" stop-color="#14252B" stop-opacity=".18"/><stop offset="1" stop-color="#091013" stop-opacity="0"/></radialGradient>
    <radialGradient id="paperWash" cx="16%" cy="5%" r="100%"><stop offset="0" stop-color="#FFF9ED" stop-opacity=".62"/><stop offset=".54" stop-color="#EEE7DB" stop-opacity=".24"/><stop offset="1" stop-color="#C9BCA8" stop-opacity=".16"/></radialGradient>
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#091013"/><stop offset=".62" stop-color="#091013" stop-opacity=".88"/><stop offset="1" stop-color="#091013" stop-opacity="0"/></linearGradient>
    <linearGradient id="fadeBottom" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#091013" stop-opacity="0"/><stop offset=".55" stop-color="#091013" stop-opacity=".72"/><stop offset="1" stop-color="#091013"/></linearGradient>
    <linearGradient id="coverFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#091013" stop-opacity="0"/><stop offset=".2" stop-color="#091013" stop-opacity=".28"/><stop offset=".42" stop-color="#091013" stop-opacity=".68"/><stop offset=".72" stop-color="#091013" stop-opacity=".91"/><stop offset="1" stop-color="#091013" stop-opacity=".98"/></linearGradient>
    
  </defs><rect width="1080" height="1350" fill="#F0ECE3"/><rect width="1080" height="1350" fill="url(#paperWash)"/>
    <text x="872" y="420" fill="#091013" opacity=".045" font-size="390" font-weight="900">01</text>
    <text x="72" y="205" fill="#C5A266" font-size="22" font-weight="850" letter-spacing="2.8">1º MOVIMENTO</text>
    <text x="72" y="292" fill="#091013" font-size="80" font-weight="900" letter-spacing="-3"><tspan x="72" dy="0">TORNAR A</tspan><tspan x="72" dy="84">OPERAÇÃO LEGÍVEL.</tspan></text>
    <text x="72" y="490" fill="#5C6263" font-size="31" font-weight="650">Antes de automatizar, descubra:</text>
    <line x1="72" y1="550" x2="1008" y2="550" stroke="#C5BCAF" stroke-width="2"/>
    <text x="72" y="625" fill="#C5A266" font-size="38" font-weight="900">01</text><text x="155" y="625" fill="#091013" font-size="34" font-weight="800">Onde o lead deixa de avançar?</text>
    <line x1="72" y1="680" x2="1008" y2="680" stroke="#C5BCAF" stroke-width="2"/>
    <text x="72" y="755" fill="#C5A266" font-size="38" font-weight="900">02</text><text x="155" y="755" fill="#091013" font-size="34" font-weight="800">O que se repete todos os dias?</text>
    <line x1="72" y1="810" x2="1008" y2="810" stroke="#C5BCAF" stroke-width="2"/>
    <text x="72" y="885" fill="#C5A266" font-size="38" font-weight="900">03</text><text x="155" y="885" fill="#091013" font-size="34" font-weight="800">O que ainda depende do dono?</text>
    <line x1="72" y1="940" x2="1008" y2="940" stroke="#C5BCAF" stroke-width="2"/>
    <text x="72" y="1015" fill="#C5A266" font-size="38" font-weight="900">04</text><text x="155" y="1015" fill="#091013" font-size="34" font-weight="800">Onde o contexto se perde?</text>
    <line x1="72" y1="1070" x2="1008" y2="1070" stroke="#C5BCAF" stroke-width="2"/>
    <text x="72" y="1132" fill="#091013" font-size="47" font-weight="900" letter-spacing="-1.4"><tspan x="72" dy="0">O GARGALO REVELA</tspan><tspan x="72" dy="51">A PRIMEIRA PEÇA.</tspan></text>
    <text x="1008" y="1215" text-anchor="end" fill="#5C6263" font-size="19" font-weight="650">Sem diagnóstico, a IA executa o mesmo erro mais rápido.</text><g transform="translate(72 50) scale(0.255)">
    <g fill="none" stroke="#10181B" stroke-width="27" stroke-linecap="square" stroke-linejoin="miter">
