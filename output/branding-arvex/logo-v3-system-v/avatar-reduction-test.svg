<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">ARVEX — teste de redução dos símbolos</title>
  <desc id="desc">Comparação das opções com V explícito e V em negativo em três tamanhos de avatar.</desc>
  <rect width="1200" height="360" fill="#ECEAE4"/>
  <text x="55" y="63" fill="#0B0D10" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="750">Teste de avatar</text>
  <text x="55" y="97" fill="#5B5E66" font-family="Inter, Arial, sans-serif" font-size="17">O V direto continua identificável na menor escala; o V negativo vira uma assinatura descoberta de perto.</text>

  <text x="55" y="169" fill="#0B0D10" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">V direto</text>
  <g transform="translate(280 128) scale(.25)">
