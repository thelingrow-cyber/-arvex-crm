    <text x="108" y="1180" fill="#F2F0E9" font-size="22" font-weight="600"><tspan x="108" dy="0">Empresa desenhada para operar com IA no núcleo.</tspan><tspan x="108" dy="30">Não é instalar IA na empresa antiga. É redesenhar a parte que trava. →</tspan></text> 
    
    
