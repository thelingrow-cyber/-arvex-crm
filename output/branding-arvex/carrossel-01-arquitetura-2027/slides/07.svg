    <text x="76" y="302" fill="#F2F0E9" font-size="71" font-weight="900" letter-spacing="-3"><tspan x="76" dy="0">A VANTAGEM NÃO ESTÁ</tspan><tspan x="76" dy="77">EM TER IA. ESTÁ EM</tspan><tspan x="76" dy="77">FAZÊ-LA FUNCIONAR.</tspan></text>
