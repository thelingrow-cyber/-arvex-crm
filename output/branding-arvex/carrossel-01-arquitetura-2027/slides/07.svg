      <text x="28" y="110" fill="#F2F0E9" font-size="31" font-weight="900">Diagnosticar</text>
      <text x="28" y="151" fill="#A7AFBC" font-size="21" font-weight="600"><tspan x="28" dy="0">o gargalo que limita</tspan><tspan x="28" dy="29">a empresa.</tspan></text>
